name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci` runs the `prisma generate` postinstall, which fails without
      # DATABASE_URL resolved. Same value the APK job already uses.
      - name: Install dependencies
        env:
          DATABASE_URL: "file:ci.db"
        run: npm ci --no-audit --no-fund

      # Warnings are reported but do not fail the job, so the nine known
      # unused-variable warnings do not block unrelated work. Use
      # `--max-warnings 0` once those are cleared.
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci` runs the `prisma generate` postinstall, which fails without
      # DATABASE_URL resolved. Same value the APK job already uses.
      - name: Install dependencies
        env:
          DATABASE_URL: "file:ci.db"
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          DATABASE_URL: "file:ci.db"
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
